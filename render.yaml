services:
  - type: web
    name: paceiq-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: paceiq-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PACEIQ_DB_PATH
        value: /opt/render/project/src/backend/data/paceiq.db
